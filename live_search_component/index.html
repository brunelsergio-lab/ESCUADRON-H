<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root {
      color-scheme: dark;
      font-family: "Source Sans Pro", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    body {
      margin: 0;
      background: transparent;
    }
    label {
      display: block;
      margin: 0 0 0.35rem 0;
      color: rgba(250, 250, 250, 0.86);
      font-size: 0.88rem;
      font-weight: 400;
    }
    input {
      box-sizing: border-box;
      width: 100%;
      min-height: 2.65rem;
      border-radius: 10px;
      border: 1px solid rgba(215, 229, 31, 0.26);
      background: rgba(15, 24, 12, 0.92);
      color: rgb(250, 250, 250);
      font: inherit;
      padding: 0.55rem 0.75rem;
      outline: none;
    }
    input:focus {
      border-color: #D7E51F;
      box-shadow: 0 0 0 1px #D7E51F;
    }
    input::placeholder {
      color: rgba(250, 250, 250, 0.45);
    }
  </style>
</head>
<body>
  <label id="label" for="search"></label>
  <input id="search" type="search" autocomplete="off" />

  <script>
    const input = document.getElementById("search");
    const label = document.getElementById("label");
    let currentValue = "";
    let debounceTimer = null;

    function post(type, data = {}) {
      window.parent.postMessage({
        isStreamlitMessage: true,
        type,
        ...data
      }, "*");
    }

    function setFrameHeight() {
      post("streamlit:setFrameHeight", { height: document.body.scrollHeight + 4 });
    }

    function sendValue(value) {
      currentValue = value;
      post("streamlit:setComponentValue", { value });
    }

    input.addEventListener("input", () => {
      clearTimeout(debounceTimer);
      debounceTimer = setTimeout(() => sendValue(input.value), 80);
    });

    window.addEventListener("message", (event) => {
      const data = event.data || {};
      if (data.type !== "streamlit:render") return;

      const args = data.args || {};
      label.textContent = args.label || "Buscar";
      input.placeholder = args.placeholder || "";

      const incomingValue = args.value || "";
      if (document.activeElement !== input && incomingValue !== currentValue) {
        currentValue = incomingValue;
        input.value = incomingValue;
      }

      setFrameHeight();
    });

    post("streamlit:componentReady", { apiVersion: 1 });
    setFrameHeight();
  </script>
</body>
</html>
